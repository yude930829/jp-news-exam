<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>新聞日語期中考｜全功能互動刷題系統</title>
  <style>
    /* ==========================================================================
       1. 核心設計系統變數 (Modern Dark Theme Tokens)
       ========================================================================== */
    :root {
      --bg-main: #0f1117;
      --bg-card: #181b24;
      --bg-card-elevated: #1f2430;
      --bg-card-hover: #252b3b;
      --bg-spoiler: #2a3142;
      --border-subtle: #2a3040;
      --border-focus: #3b82f6;
      
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.14);
      
      --success: #10b981;
      --success-hover: #059669;
      --success-soft: rgba(16, 185, 129, 0.15);
      --success-border: rgba(16, 185, 129, 0.45);
      
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.45);
      
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.5), 0 4px 12px -2px rgba(0, 0, 0, 0.35);
      --font-sans: "Inter", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. 頂部導覽列與進度控制區
       ========================================================================== */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
    }

    .header-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text-primary);
    }

    .brand-badge {
      background: var(--primary-soft);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--bg-card-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      min-height: 36px;
    }

    .tool-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--primary);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .unit-select-wrapper {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .unit-select {
      width: 100%;
      min-height: 48px;
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 38px 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .unit-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .unit-select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    /* 隨機亂序切換開關 */
    .shuffle-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .shuffle-toggle:hover {
      border-color: #4b5563;
      color: var(--text-primary);
    }

    .shuffle-toggle.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: #93c5fd;
    }

    .switch-track {
      width: 38px;
      height: 22px;
      background: #374151;
      border-radius: 999px;
      position: relative;
      transition: background 0.25s ease;
    }

    .shuffle-toggle.active .switch-track {
      background: var(--primary);
    }

    .switch-thumb {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .shuffle-toggle.active .switch-thumb {
      transform: translateX(16px);
    }

    /* 進度條與計數器 */
    .progress-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .progress-Right-Group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .review-queue-pill {
      display: none;
      background: var(--warning-soft);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    .review-queue-pill.visible {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--bg-card-elevated);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==========================================================================
       3. 主舞台與題卡容器
       ========================================================================== */
    .main-container {
      max-width: 820px;
      margin: 24px auto 64px;
      padding: 0 16px;
    }

    .stage-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-card);
      transition: all 0.25s ease;
    }

    @media (max-width: 600px) {
      .stage-card {
        padding: 18px 16px;
      }
    }

    .question-header-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .unit-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-card-elevated);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .mode-tag {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.04em;
    }

    .mode-tag.quiz {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .mode-tag.flashcard {
      background: rgba(168, 85, 247, 0.14);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .mode-tag.cloze {
      background: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* 底線漢字強調樣式 */
    u {
      text-decoration: none;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 2px;
      color: #60a5fa;
      font-weight: 700;
    }

    /* ==========================================================================
       4. 模式一：[QUIZ] 單選題模式
       ========================================================================== */
    .quiz-question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.75;
      margin-bottom: 24px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-option-btn {
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      background: var(--bg-card-elevated);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .quiz-option-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .quiz-option-btn:disabled {
      cursor: default;
    }

    .quiz-option-btn.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: #ecfdf5;
    }

    .quiz-option-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #fef2f2;
    }

    .quiz-option-btn.dimmed {
      opacity: 0.55;
    }

    .option-status-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    /* 展開式解析區 */
    .feedback-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: var(--radius-md);
      background: var(--bg-card-elevated);
      border-left: 4px solid var(--primary);
      animation: slideDownFade 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .feedback-box.correct-fb {
      border-left-color: var(--success);
    }

    .feedback-box.wrong-fb {
      border-left-color: var(--danger);
    }

    @keyframes slideDownFade {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feedback-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-answer {
      font-size: 1.05rem;
      color: #60a5fa;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .feedback-note {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ==========================================================================
       5. 模式二：[FLASHCARD] 雙面 3D 記憶卡翻牌模式
       ========================================================================== */
    .flashcard-scene {
      width: 100%;
      min-height: 270px;
      perspective: 1200px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      min-height: 270px;
      transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .flashcard-scene.is-flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 270px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid var(--border-subtle);
      background: linear-gradient(145deg, #1b1f2a, #151821);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .flashcard-face:hover {
      border-color: rgba(59, 130, 246, 0.5);
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #1e2536, #161b26);
      border-color: var(--primary);
    }

    .card-face-label {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .card-flip-hint {
      position: absolute;
      bottom: 14px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .flashcard-front-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.7;
      color: var(--text-primary);
      max-width: 95%;
      margin: 16px 0;
    }

    .flashcard-back-answer {
      font-size: 1.55rem;
      font-weight: 800;
      color: #60a5fa;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .flashcard-back-note {
      font-size: 0.94rem;
      color: #d1d5db;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--warning);
      max-width: 92%;
      text-align: left;
    }

    /* ==========================================================================
       6. 模式三：[CLOZE] 點擊遮罩揭曉模式 (Spoiler Button)
       ========================================================================== */
    .cloze-instruction {
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cloze-content-box {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 2.1;
      color: var(--text-primary);
      background: var(--bg-card-elevated);
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      margin-bottom: 18px;
    }

    .cloze-sublist {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cloze-subitem {
      padding: 10px 14px;
      background: rgba(15, 17, 23, 0.55);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    /* 遮罩塊 Spoiler Button */
    .spoiler-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      min-width: 120px;
      padding: 4px 14px;
      margin: 2px 4px;
      border-radius: var(--radius-sm);
      background: var(--bg-spoiler);
      border: 1.5px dashed var(--primary);
      color: transparent;
      position: relative;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      vertical-align: middle;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .spoiler-btn::after {
      content: "👆 點擊揭曉答案";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: rgba(30, 41, 59, 0.9);
      border-radius: calc(var(--radius-sm) - 2px);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .spoiler-btn:hover:not(.revealed)::after {
      background: rgba(59, 130, 246, 0.25);
      color: #ffffff;
    }

    .spoiler-btn.revealed {
      background: var(--success-soft);
      border: 1.5px solid var(--success);
      color: #34d399;
      cursor: default;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }

    .spoiler-btn.revealed::after {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .cloze-hint-text {
      color: var(--text-secondary);
      font-size: 0.96rem;
      font-weight: 500;
    }

    /* ==========================================================================
       7. 底部操作按鈕群 (大於 48px 觸控高度)
       ========================================================================== */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn-large {
      flex: 1;
      min-width: 140px;
      min-height: 52px;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-unfamiliar {
      background: var(--danger-soft);
      color: #fca5a5;
      border-color: var(--danger-border);
    }

    .btn-unfamiliar:hover {
      background: rgba(239, 68, 68, 0.26);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-mastered {
      background: var(--success-soft);
      color: #6ee7b7;
      border-color: var(--success-border);
    }

    .btn-mastered:hover {
      background: rgba(16, 185, 129, 0.26);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-card-elevated);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--text-secondary);
    }

    /* ==========================================================================
       8. 結算與錯題速背面板
       ========================================================================== */
    .summary-header {
      text-align: center;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }

    .score-circle {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.25), rgba(24, 27, 36, 0.9));
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
    }

    .score-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .score-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stat-card {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .stat-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .mistake-list-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mistake-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 24px;
    }

    .mistake-item {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--danger);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .mistake-item-q {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .mistake-item-a {
      font-size: 0.95rem;
      color: #34d399;
      font-weight: 700;
    }

    .mistake-item-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;

    /* ==========================================================================
       應用程式狀態管理 (State & Queue Engine)
       ========================================================================== */
    const state = {
      currentUnit: "ALL",
      shuffle: false,
      queue: [],            // 當前進行中的題目佇列（支援智慧循環重排）
      initialTotal: 0,      // 本輪初始總題數
      currentIndex: 0,      // 當前佇列指標
      masteredIds: new Set(),
      mistakeMap: new Map(), // 記錄曾經答錯或標記「還不熟」的題目 (id -> item)
      firstAttemptDone: new Set(),
      firstAttemptCorrect: 0,
      quizLocked: false,
      cardFlipped: false
    };

    // DOM 參照
    const unitSelectEl = document.getElementById("unitSelect");
    const shuffleToggleEl = document.getElementById("shuffleToggle");
    const progressCounterEl = document.getElementById("progressCounter");
    const progressPercentEl = document.getElementById("progressPercent");
    const progressBarFillEl = document.getElementById("progressBarFill");
    const reviewQueuePillEl = document.getElementById("reviewQueuePill");
    const stageCardEl = document.getElementById("stageCard");
    const overviewModalEl = document.getElementById("overviewModal");
    const overviewBodyEl = document.getElementById("overviewBody");

    /* ==========================================================================
       初始化與洗牌工具函式
       ========================================================================== */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startSession(customItems = null) {
      let pool;
      if (customItems && Array.isArray(customItems)) {
        pool = [...customItems];
      } else {
        pool = state.currentUnit === "ALL"
          ? [...DATABASE]
          : DATABASE.filter(item => item.unit === state.currentUnit);
      }

      if (state.shuffle) {
        pool = shuffleArray(pool);
      }

      state.queue = pool.map(item => ({ ...item, isRequeued: false }));
      state.initialTotal = state.queue.length;
      state.currentIndex = 0;
      state.masteredIds.clear();
      state.mistakeMap.clear();
      state.firstAttemptDone.clear();
      state.firstAttemptCorrect = 0;
      state.quizLocked = false;
      state.cardFlipped = false;

      renderCurrentStage();
    }

    function updateProgressBar() {
      const total = state.initialTotal || 1;
      const completedCount = state.masteredIds.size;
      const pct = Math.min(100, Math.round((completedCount / total) * 100));

      if (state.currentIndex < state.queue.length) {
        const currentItem = state.queue[state.currentIndex];
        const requeueLabel = currentItem.isRequeued ? "（複習重測）" : "";
        progressCounterEl.textContent = `已掌握 ${completedCount} / ${total} 題 ｜ 目前進度：第 ${state.currentIndex + 1} 題${requeueLabel}`;
      } else {
        progressCounterEl.textContent = `測驗完成：共 ${total} 題`;
      }

      progressPercentEl.textContent = `${pct}%`;
      progressBarFillEl.style.width = `${pct}%`;

      // 計算佇列中剩餘的複習題數
      const remainingRequeued = state.queue
        .slice(state.currentIndex)
        .filter(q => q.isRequeued).length;

      if (remainingRequeued > 0) {
        reviewQueuePillEl.textContent = `🔁 循環複習佇列：${remainingRequeued} 題`;
        reviewQueuePillEl.classList.add("visible");
      } else {
        reviewQueuePillEl.classList.remove("visible");
      }
    }

    /* ==========================================================================
       主畫面渲染器 (根據題型掛載 [QUIZ]、[FLASHCARD]、[CLOZE])
       ========================================================================== */
    function renderCurrentStage() {
      updateProgressBar();

      if (state.currentIndex >= state.queue.length) {
        renderSummaryPanel();
        return;
      }

      const item = state.queue[state.currentIndex];
      state.quizLocked = false;
      state.cardFlipped = false;

      if (item.type === "QUIZ") {
        renderQuizMode(item);
      } else if (item.type === "FLASHCARD") {
        renderFlashcardMode(item);
      } else if (item.type === "CLOZE") {
        renderClozeMode(item);
      }
    }

    // --------------------------------------------------------------------------
    // 1. 渲染 [QUIZ] 單選題模式
    // --------------------------------------------------------------------------
    function renderQuizMode(item) {
      const optionsHtml = item.options.map((opt, idx) => `
        <button type="button" class="quiz-option-btn" data-key="${opt.key}" data-idx="${idx}">
          <span>${opt.label}</span>
          <span class="option-status-icon"></span>
        </button>
      `).join("");

      stageCardEl.innerHTML = `
        <div class="question-header-badges">
          <span class="unit-tag">📌 ${item.unitTitle} ・ 題號 ${item.num}</span>
          <span class="mode-tag quiz">[QUIZ] 單選題模式</span>
        </div>

        <div class="quiz-question-text">${item.question}</div>

        <div class="quiz-options-list" id="quizOptionsList">
          ${optionsHtml}
        </div>

        <div id="quizFeedbackZone"></div>

        <div class="action-bar" id="quizActionBar" style="display:none;">
          <button type="button" class="btn-large btn-primary" id="btnNextQuestion">
            下一題 →
          </button>
        </div>
      `;

      const optionButtons = stageCardEl.querySelectorAll(".quiz-option-btn");
      optionButtons.forEach(btn => {
        btn.addEventListener("click", () => handleQuizSelect(btn.dataset.key, item));
      });
    }

    function handleQuizSelect(selectedKey, item) {
      if (state.quizLocked) return;
      state.quizLocked = true;

      const isCorrect = selectedKey === item.answerKey;

      // 記錄首次作答結果
      if (!state.firstAttemptDone.has(item.id)) {
        state.firstAttemptDone.add(item.id);
        if (isCorrect) {
          state.firstAttemptCorrect++;
        } else {
          state.mistakeMap.set(item.id, item);
        }
      }

      state.masteredIds.add(item.id);

      const optionButtons = stageCardEl.querySelectorAll(".quiz-option-btn");
      optionButtons.forEach(btn => {
        btn.disabled = true;
        const key = btn.dataset.key;
        const iconSpan = btn.querySelector(".option-status-icon");

        if (key === item.answerKey) {
          btn.classList.add("correct");
          iconSpan.textContent = "⭕ 正解";
        } else if (key === selectedKey && !isCorrect) {
          btn.classList.add("wrong");
          iconSpan.textContent = "❌ 誤答";
        } else {
          btn.classList.add("dimmed");
        }
      });

      const feedbackZone = document.getElementById("quizFeedbackZone");
      feedbackZone.innerHTML = `
        <div class="feedback-box ${isCorrect ? "correct-fb" : "wrong-fb"}">
          <div class="feedback-title" style="color: ${isCorrect ? "#34d399" : "#f87171"}">
            ${isCorrect ? "✅ 答對了！" : "❌ 答錯了，已自動加入錯題速背清單"}
          </div>
          <div class="feedback-answer">標準答案：${item.answerDisplay}</div>
          ${item.note ? `<div class="feedback-note">💡 解析：${item.note}</div>` : ""}
        </div>
      `;

      const actionBar = document.getElementById("quizActionBar");
      actionBar.style.display = "flex";
      document.getElementById("btnNextQuestion").addEventListener("click", goNextQuestion);
      updateProgressBar();
    }

    // --------------------------------------------------------------------------
    // 2. 渲染 [FLASHCARD] 雙面記憶卡翻牌模式
    // --------------------------------------------------------------------------
    function renderFlashcardMode(item) {
      stageCardEl.innerHTML = `
        <div class="question-header-badges">
          <span class="unit-tag">📌 ${item.unitTitle} ・ 第 ${item.num} 題 ${item.isRequeued ? "🔁" : ""}</span>
          <span class="mode-tag flashcard">[FLASHCARD] 3D 雙面記憶卡</span>
        </div>

        <div class="flashcard-scene" id="flashcardScene" title="點擊卡片翻面">
          <div class="flashcard-inner">
            <!-- 正面 -->
            <div class="flashcard-face flashcard-front">
              <span class="card-face-label">FRONT・題目正面</span>
              <div class="flashcard-front-text">${item.question}</div>
              <span class="card-flip-hint">👆 點擊卡片或按空白鍵 3D 翻面查看標準答案</span>
            </div>

            <!-- 背面 -->
            <div class="flashcard-face flashcard-back">
              <span class="card-face-label" style="color:#93c5fd;">BACK・標準答案與讀音</span>
              <div style="font-size:0.95rem;color:var(--text-secondary);margin-bottom:8px;">${item.question}</div>
              <div class="flashcard-back-answer">${item.answer}</div>
              ${item.note ? `<div class="flashcard-back-note">${item.note}</div>` : ""}
              <span class="card-flip-hint">👆 再次點擊可翻回正面</span>
            </div>
          </div>
        </div>

        <div class="action-bar">
          <button type="button" class="btn-large btn-unfamiliar" id="btnCardUnfamiliar">
            ❌ 還不熟（排入隊列尾端重測）
          </button>
          <button type="button" class="btn-large btn-mastered" id="btnCardMastered">
            ⭕ 已記住（下一題）
          </button>
        </div>
      `;

      const sceneEl = document.getElementById("flashcardScene");
      sceneEl.addEventListener("click", () => {
        state.cardFlipped = !state.cardFlipped;
        sceneEl.classList.toggle("is-flipped", state.cardFlipped);
      });

      document.getElementById("btnCardUnfamiliar").addEventListener("click", () => {
        handleFlashcardOrClozeResult(item, false);
      });

      document.getElementById("btnCardMastered").addEventListener("click", () => {
        handleFlashcardOrClozeResult(item, true);
      });
    }

    // --------------------------------------------------------------------------
    // 3. 渲染 [CLOZE] 點擊遮罩揭曉模式
    // --------------------------------------------------------------------------
    function renderClozeMode(item) {
      // 將 {{答案}} 轉換為可點擊的深色模糊遮罩按鈕
      let blankIdx = 0;
      const formattedQuestion = item.question.replace(/\{\{(.+?)\}\}/g, (_, ansText) => {
        blankIdx++;
        return `<button type="button" class="spoiler-btn" data-blank-idx="${blankIdx}" title="點擊揭曉此格答案">${ansText}</button>`;
      });

      stageCardEl.innerHTML = `
        <div class="question-header-badges">
          <span class="unit-tag">📌 ${item.unitTitle} ・ 第 ${item.num} 題 ${item.isRequeued ? "🔁" : ""}</span>
          <span class="mode-tag cloze">[CLOZE] 點擊遮罩揭曉模式</span>
        </div>

        <div class="cloze-instruction">
          <span>👇 請先思考括號提示，再點擊深色遮罩塊揭曉標準答案：</span>
          <button type="button" class="tool-btn" id="btnRevealAllSpoilers">👁️ 一鍵揭曉全部答案</button>
        </div>

        <div class="cloze-content-box" id="clozeContentBox">
          ${formattedQuestion}
        </div>

        <div id="clozeFeedbackBox" class="feedback-box" style="display:none;">
          <div class="feedback-answer">標準答案：${item.answer}</div>
          ${item.note ? `<div class="feedback-note">💡 解析：${item.note}</div>` : ""}
        </div>

        <div class="action-bar">
          <button type="button" class="btn-large btn-unfamiliar" id="btnClozeUnfamiliar">
            ❌ 還不熟（加入錯題並排入隊尾）
          </button>
          <button type="button" class="btn-large btn-mastered" id="btnClozeMastered">
            ⭕ 已掌握（下一題）
          </button>
        </div>
      `;

      const spoilerBtns = stageCardEl.querySelectorAll(".spoiler-btn");
      const feedbackBox = document.getElementById("clozeFeedbackBox");

      function checkAllRevealed() {
        const allRevealed = Array.from(spoilerBtns).every(b => b.classList.contains("revealed"));
        if (allRevealed) {
          feedbackBox.style.display = "block";
        }
      }

      spoilerBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          btn.classList.add("revealed");
          checkAllRevealed();
        });
      });

      document.getElementById("btnRevealAllSpoilers").addEventListener("click", () => {
        spoilerBtns.forEach(btn => btn.classList.add("revealed"));
        feedbackBox.style.display = "block";
      });

      document.getElementById("btnClozeUnfamiliar").addEventListener("click", () => {
        handleFlashcardOrClozeResult(item, false);
      });

      document.getElementById("btnClozeMastered").addEventListener("click", () => {
        handleFlashcardOrClozeResult(item, true);
      });
    }

    // 處理記憶卡與填空題的「還不熟 / 已記住」智慧佇列邏輯
    function handleFlashcardOrClozeResult(item, isMastered) {
      if (!state.firstAttemptDone.has(item.id)) {
        state.firstAttemptDone.add(item.id);
        if (isMastered) {
          state.firstAttemptCorrect++;
        } else {
          state.mistakeMap.set(item.id, item);
        }
      }

      if (isMastered) {
        state.masteredIds.add(item.id);
      } else {
        // 智慧循環佇列：點擊「還不熟」自動排入隊列末尾，直到全部掌握
        state.mistakeMap.set(item.id, item);
        state.queue.push({ ...item, isRequeued: true });
      }

      goNextQuestion();
    }

    function goNextQuestion() {
      state.currentIndex++;
      renderCurrentStage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================================
       結算與錯題速背面板 (Summary & Mistake Review Panel)
       ========================================================================== */
    function renderSummaryPanel() {
      const total = state.initialTotal || 1;
      const accuracy = Math.round((state.firstAttemptCorrect / total) * 100);
      const mistakes = Array.from(state.mistakeMap.values());

      let mistakeHtml = "";
      if (mistakes.length === 0) {
        mistakeHtml = `
          <div style="text-align:center;padding:28px 16px;background:var(--success-soft);border:1px solid var(--success-border);border-radius:var(--radius-md);margin-bottom:24px;">
            <div style="font-size:2rem;margin-bottom:8px;">🏆</div>
            <div style="font-weight:700;font-size:1.1rem;color:#ecfdf5;">太強了！本單元一次全數通關，沒有任何錯題或生疏題目！</div>
          </div>
        `;
      } else {
        const itemsHtml = mistakes.map(m => {
          const cleanQuestion = m.question.replace(/\{\{(.+?)\}\}/g, "【 $1 】");
          const ansText = m.type === "QUIZ" ? m.answerDisplay : m.answer;
          return `
            <div class="mistake-item">
              <div style="font-size:0.76rem;color:var(--text-secondary);margin-bottom:4px;">
                ${m.unitTitle} ・ 題號 ${m.num} [${m.type}]
              </div>
              <div class="mistake-item-q">${cleanQuestion}</div>
              <div class="mistake-item-a">✔ 標準答案：${ansText}</div>
              ${m.note ? `<div class="mistake-item-note">💡 ${m.note}</div>` : ""}
            </div>
          `;
        }).join("");

        mistakeHtml = `
          <div class="mistake-list-title">
            <span>📌 錯題與不熟速背清單（共 ${mistakes.length} 題）</span>
          </div>
          <div class="mistake-cards">
            ${itemsHtml}
          </div>
        `;
      }

      stageCardEl.innerHTML = `
        <div class="summary-header">
          <div class="score-circle">
            <span class="score-number">${accuracy}%</span>
            <span class="score-label">首次答對率</span>
          </div>
          <h2 style="font-size:1.35rem;font-weight:800;margin-bottom:4px;">🎉 單元測驗完成！</h2>
          <p style="font-size:0.92rem;color:var(--text-secondary);">所有標記「還不熟」的卡片皆已完成循環複習</p>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-val" style="color:#60a5fa;">${total}</div>
              <div class="stat-desc">總題數</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" style="color:#34d399;">${state.firstAttemptCorrect}</div>
              <div class="stat-desc">首次即掌握</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" style="color:#f87171;">${mistakes.length}</div>
              <div class="stat-desc">重點複習題</div>
            </div>
          </div>
        </div>

        ${mistakeHtml}

        <div class="action-bar">
          ${mistakes.length > 0 ? `
            <button type="button" class="btn-large btn-unfamiliar" id="btnRetryMistakes">
              🔥 針對這 ${mistakes.length} 道錯題進行特訓
            </button>
          ` : ""}
          <button type="button" class="btn-large btn-primary" id="btnRestartAll">
            🔄 重新測驗本單元
          </button>
        </div>
      `;

      const btnRetryMistakes = document.getElementById("btnRetryMistakes");
      if (btnRetryMistakes) {
        btnRetryMistakes.addEventListener("click", () => {
          startSession(mistakes);
        });
      }

      document.getElementById("btnRestartAll").addEventListener("click", () => {
        startSession();
      });
    }

    /* ==========================================================================
       題庫完整速覽 Modal 與下載離線單一檔案功能
       ========================================================================== */
    function openOverviewModal() {
      const pool = state.currentUnit === "ALL"
        ? DATABASE
        : DATABASE.filter(item => item.unit === state.currentUnit);

      overviewBodyEl.innerHTML = pool.map(item => {
        const cleanQ = item.question.replace(/\{\{(.+?)\}\}/g, "<span style='color:#34d399;font-weight:700;'>[$1]</span>");
        const ans = item.type === "QUIZ"
          ? `${item.answerDisplay} — ${item.options.find(o => o.key === item.answerKey)?.label || ""}`
          : item.answer;

        return `
          <div style="background:var(--bg-card-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;">
            <div style="font-size:0.75rem;color:#93c5fd;font-weight:700;margin-bottom:4px;">
              ${item.unitTitle} (#${item.num}) [${item.type}]
            </div>
            <div style="font-weight:600;margin-bottom:6px;">${cleanQ}</div>
            <div style="color:#34d399;font-size:0.92rem;font-weight:700;">標準答案：${ans}</div>
            ${item.note ? `<div style="color:var(--text-secondary);font-size:0.84rem;margin-top:4px;">${item.note}</div>` : ""}
          </div>
        `;
      }).join("");

      overviewModalEl.classList.add("open");
    }

    // 綁定頂部導覽列事件
    unitSelectEl.addEventListener("change", (e) => {
      state.currentUnit = e.target.value;
      startSession();
    });

    shuffleToggleEl.addEventListener("click", () => {
      state.shuffle = !state.shuffle;
      shuffleToggleEl.classList.toggle("active", state.shuffle);
      shuffleToggleEl.setAttribute("aria-checked", String(state.shuffle));
      startSession();
    });

    document.getElementById("btnRestartNow").addEventListener("click", () => startSession());
    document.getElementById("btnOpenOverview").addEventListener("click", openOverviewModal);
    document.getElementById("btnCloseOverview").addEventListener("click", () => {
      overviewModalEl.classList.remove("open");
    });
    overviewModalEl.addEventListener("click", (e) => {
      if (e.target === overviewModalEl) overviewModalEl.classList.remove("open");
    });

    // 下載單一離線 HTML 檔
    document.getElementById("btnDownloadHtml").addEventListener("click", () => {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "新聞日語期中考刷題系統_離線版.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 鍵盤快捷鍵支援
    window.addEventListener("keydown", (e) => {
      if (overviewModalEl.classList.contains("open")) {
        if (e.key === "Escape") overviewModalEl.classList.remove("open");
        return;
      }
      if (state.currentIndex >= state.queue.length) return;

      const item = state.queue[state.currentIndex];

      if (item.type === "QUIZ") {
        if (!state.quizLocked && ["1", "2", "3", "4"].includes(e.key)) {
          const idx = parseInt(e.key, 10) - 1;
          const opt = item.options[idx];
          if (opt) handleQuizSelect(opt.key, item);
        } else if (state.quizLocked && (e.key === "Enter" || e.key === "ArrowRight")) {
          e.preventDefault();
          goNextQuestion();
        }
      } else if (item.type === "FLASHCARD") {
        if (e.code === "Space") {
          e.preventDefault();
          const sceneEl = document.getElementById("flashcardScene");
          if (sceneEl) sceneEl.click();
        } else if (e.key === "ArrowRight" || e.key === "Enter") {
          e.preventDefault();
          handleFlashcardOrClozeResult(item, true);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          handleFlashcardOrClozeResult(item, false);
        }
      }
    });

    // 啟動系統
    window.onload = function () {
      startSession();
    };
  </script>
</body>
</html>
